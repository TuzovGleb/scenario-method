<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Методика · доступ</title>
<style>
body{font-family:'PT Sans','Segoe UI',Arial,sans-serif;background:#1e1d1a;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#2a2925;border-radius:14px;padding:36px 34px;max-width:360px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
h1{font-size:19px;margin:0 0 6px}
p{font-size:13px;color:#999;margin:0 0 18px;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:8px;border:1px solid #4a4840;background:#1e1d1a;color:#eee;font-size:14px;margin-bottom:12px}
button{width:100%;padding:11px;border:none;border-radius:8px;background:#b07d00;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
button:hover{background:#c98f00}
#err{color:#e07f6f;font-size:12.5px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="card">
<h1>Методика написания сценариев</h1>
<p>Материал закрыт. Введите пароль доступа.</p>
<input type="password" id="pw" placeholder="Пароль" autofocus>
<button id="go">Открыть</button>
<div id="err">Неверный пароль</div>
</div>
<script>
async function unlock(){
  var pw=document.getElementById('pw').value;
  try{
    var b64=(await (await fetch('payload.txt',{cache:'no-store'})).text()).replace(/\s+/g,'');
    var raw=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});
    var salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    var ds=new DecompressionStream('gzip');
    var stream=new Blob([pt]).stream().pipeThrough(ds);
    var htmlText=await new Response(stream).text();
    htmlText=htmlText.replace('</body>','<script src="comments.js" defer><\/script></body>');
    document.open();document.write(htmlText);document.close();
  }catch(e){document.getElementById('err').style.display='block';}
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
</script>
</body>
</html>
